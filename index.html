<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>How Sustainable Are You?</title><style>
*{box-sizing:border-box}body{margin:0;background:white;color:#171c19;font:16px Arial,Helvetica,sans-serif}.sheet{max-width:880px;margin:64px auto;padding:0 40px 64px}h1{font-size:32px;color:#23533e;letter-spacing:1px;margin:0 0 38px}.details{display:flex;gap:50px;margin-bottom:30px}.details label{display:flex;align-items:center;gap:8px;flex:1}.details input{border:0;border-bottom:1px solid #777;width:100%;font:inherit;padding:6px;min-width:0}p{margin:0 0 24px}table{width:100%;border-collapse:collapse;table-layout:fixed}th{background:#e8f0eb;font-size:14px;height:46px}th:first-child{text-align:left;width:64%;padding:12px}td{border-bottom:1px solid #cbd3ce;height:75px;padding:12px;font-size:15px;line-height:1.45}td:not(:first-child){text-align:center;padding:0}input[type=radio]{appearance:none;width:18px;height:18px;border:1px solid #444;border-radius:0;cursor:pointer;margin:0;vertical-align:middle;background:white}input[type=radio]:checked{background:#23533e;border-color:#23533e;box-shadow:inset 0 0 0 3px white}input:focus-visible,button:focus-visible{outline:3px solid #529e77;outline-offset:4px}td label{display:flex;align-items:center;justify-content:center;min-height:74px;cursor:pointer}.status{font-size:14px;color:#4e5e54;margin:22px 0}button{font:inherit;background:#23533e;color:white;border:0;padding:14px 24px;cursor:pointer}#result{border:0;border-radius:12px;padding:32px;width:min(460px,calc(100vw - 32px));max-height:calc(100vh - 40px);overflow:auto;position:fixed;inset:0;margin:auto;box-shadow:0 18px 70px #0004;line-height:1.6;color:#fff}#result::backdrop{background:rgba(15,25,20,.48)}#result.green{background:#23633e}#result.blue{background:#235c99}#result.red{background:#a83232}#result p{margin:0 0 14px}#result h2{font-size:25px;color:inherit;margin:0 0 12px}#result button{margin-top:8px;background:white;color:#1d2922;border-radius:5px}[hidden]{display:none!important}@media(max-width:600px){.sheet{margin:32px auto;padding:0 16px 32px}h1{font-size:27px}.details{gap:20px;flex-direction:column}th:first-child{width:55%}th{font-size:11px}td{font-size:13px;padding:12px 8px;height:88px}td label{min-height:88px}}@media print{.sheet{margin:20px auto}.status,#show-result,#result{display:none!important}}
</style></head><body><main class="sheet"><h1>How Sustainable Are You?</h1><form id="quiz"><div class="details"><label>Name: <input type="text" name="student" autocomplete="given-name"></label><label>Date: <input type="text" name="date" aria-label="Date"></label></div><p>Tick one answer for each question.</p><table><thead><tr><th scope="col">Question</th><th scope="col">Always</th><th scope="col">Sometimes</th><th scope="col">Never</th></tr></thead><tbody id="questions"></tbody></table><p class="status" id="progress" role="status" aria-live="polite">0 of 10 questions answered.</p><button type="button" id="show-result" hidden>Show my result</button><dialog id="result" aria-labelledby="result-title"><div id="result-content"></div><button type="button" id="close-result">Close</button></dialog></form></main><script>
const questions=['Do you turn off the lights when you leave a room?','Do you turn off the water when you brush your teeth?','Do you take short showers?','Do you use buses or walk to school?','Do you use both sides of a piece of paper?','Do you take your own bag when you go shopping?','Do you use a water bottle more than once?','Do you repair old things?','Do you buy second-hand clothes?','Do you give old clothes to other people?'];
const form=document.querySelector('#quiz'),button=document.querySelector('#show-result'),result=document.querySelector('#result');
document.querySelector('#questions').innerHTML=questions.map((q,i)=>`<tr><td id="q${i}">${i+1}. ${q}</td>${['Always','Sometimes','Never'].map((a,j)=>`<td><label><input type="radio" name="q${i}" value="${2-j}" aria-label="Question ${i+1}: ${a}" aria-describedby="q${i}" required></label></td>`).join('')}</tr>`).join('');
function getAnswers(){return Array.from(form.querySelectorAll('input[type=radio]:checked'));}
form.addEventListener('submit',e=>e.preventDefault());
form.addEventListener('change',e=>{if(e.target.type!=='radio')return;const n=getAnswers().length;document.querySelector('#progress').textContent=`${n} of 10 questions answered.`;button.hidden=n!==10;result.close();button.textContent='Show my result';});
button.addEventListener('click',()=>{const answers=getAnswers();if(answers.length!==10)return;const score=answers.reduce((s,a)=>s+Number(a.value),0);const counts=[2,1,0].map(v=>answers.filter(a=>Number(a.value)===v).length);let title,message;if(score>=16){title='Great green habits!';message='You do many things to help the planet. Keep going!';}else if(score>=9){title='You are doing well!';message='You have some green habits. Try to do them more often.';}else{title='Start with one small change!';message='You can help the planet. Try to save water and turn off the lights.';}result.className=score>=16?'green':score>=9?'blue':'red';document.querySelector('#result-content').innerHTML=`<h2 id="result-title">${title}</h2><p>${message}</p><p>Always: ${counts[0]} · Sometimes: ${counts[1]} · Never: ${counts[2]}</p>`;result.showModal();button.textContent='My result';});
document.querySelector('#close-result').addEventListener('click',()=>result.close());
</script></body></html>
